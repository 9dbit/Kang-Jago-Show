name: Import hero PNG assets

on:
  push:
    branches:
      - asset/png-hero-refresh
    paths:
      - '.hero-png-ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Dropbox hero folder
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://www.dropbox.com/scl/fo/rtgepaam9r02b2um8nvo1/ADIf4smXtdHAV9ZwMsmSy-o?rlkey=7vn6rnue1srehvmza2us2oulw&dl=1' \
            -o /tmp/hero.zip
          mkdir -p /tmp/hero-src
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src = Path('/tmp/hero.zip')
          out = Path('/tmp/hero-src')
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = Path(info.filename).name
                  if not name:
                      continue
                  target = out / name
                  target.write_bytes(z.read(info))
                  print(target)
          PY

      - name: Map original images to sequence by SHA-256
        run: |
          set -euo pipefail
          mkdir -p public/hero
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              'e7eee1a67fbe1fb0bd5e413805e428033a567d4251069986ae081892a2e8c396': 'frame-01.png',
              'e9cacc158a6f857e3da5e981937d583c581bfec3911c59dcb8b59c71bba58f56': 'frame-02.png',
              'a5731bf67a2008f22e2759d975fae32a4cf9e379e3e563379d45039be5b7eea8': 'frame-03.png',
              '9a0e8dc7cc05b4f7248abbe76ecb1f924aa081223623830689c9593b437e2136': 'frame-04.png',
              'a9e0da699f9ad9e8b8fbd3e0d79c06331addc5effe823f0589f119507be733b5': 'frame-05.png',
              '28fa17336367c16ae30a9a6a87bff490f03e44539c57be9e74a76b630ad11407': 'frame-06.png',
              'b316070632e332eec1f5ead404bd1a85a1d477f2965229de63564173c74581ba': 'frame-07.png',
              '955a229c3a2b60aa3cc79ada53ae7b70c7ced38b4bde5fc09c6da48b9a0ebf7a': 'frame-08.png',
              '01aa6c852ee44d32a61b2b5a578d7e0acc4b425e80ed2c7ac9896ff996c61e1c': 'frame-09.png',
              '1933ad55b4969ef2793e209f94b0d303076c9f77aa4ec56888d517d96647a702': 'frame-10.png',
          }

          found = {}
          for p in Path('/tmp/hero-src').iterdir():
              if not p.is_file():
                  continue
              data = p.read_bytes()
              sha = hashlib.sha256(data).hexdigest()
              print(f'{sha}  {p.name}')
              if sha in expected:
                  out = Path('public/hero') / expected[sha]
                  out.write_bytes(data)
                  found[sha] = p.name
                  print(f'MAPPED {p.name} -> {out}')

          missing = [expected[s] for s in expected if s not in found]
          if missing:
              raise SystemExit('Missing expected images: ' + ', '.join(missing))
          PY

      - name: Verify PNG signatures and dimensions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for i in range(1, 11):
              p = Path(f'public/hero/frame-{i:02d}.png')
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{p} is not PNG')
              w, h = struct.unpack('>II', data[16:24])
              if w < 768 or h < 1100:
                  raise SystemExit(f'{p} too small: {w}x{h}')
              print(f'{p}: {w}x{h}, {len(data)} bytes')
          PY

      - name: Commit imported PNG assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hero/frame-*.png
          git diff --cached --quiet || git commit -m 'assets: import original PNG hero sequence'
          git push origin HEAD:asset/png-hero-refresh
