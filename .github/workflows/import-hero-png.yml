name: Import hero PNG assets

on:
  push:
    branches:
      - asset/png-hero-refresh
    paths:
      - '.hero-png-ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Dropbox hero folder
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            'https://www.dropbox.com/scl/fo/rtgepaam9r02b2um8nvo1/ADIf4smXtdHAV9ZwMsmSy-o?rlkey=7vn6rnue1srehvmza2us2oulw&dl=1' \
            -o /tmp/hero.zip
          mkdir -p /tmp/hero-src
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          src = Path('/tmp/hero.zip')
          out = Path('/tmp/hero-src')
          with zipfile.ZipFile(src) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = Path(info.filename).name
                  if not name:
                      continue
                  target = out / name
                  target.write_bytes(z.read(info))
                  print(target)
          PY

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: Map original images to sequence by perceptual hash
        run: |
          set -euo pipefail
          mkdir -p public/hero
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected_hex = [
            'a49ba49ca41c8cccf53c5334c65c8ca862e635920e182d996599c6988a8e66c1',
            'a41aa4dca41c8cccf5bc4334c25c92f46ce606320f992d9865b3c6b89a9c66c1',
            'a49ba49ca47c8c9cf5bc4334c4dcb0f4796623621719779935b7e2b89a9666c1',
            'a49ba49ca47c8d9cf59c473cc6d8b074796617220f1837986532c0308a9c66c0',
            'a41aa4dca59c8d1cfb5c42f4d25c98d068f2132217982f9875b7c2388e9e66c1',
            'a45ba59ca33c8f0cfa1c4274ca7c88686c6e0e4a1b281b29732bc1e498f46508',
            'a4daa51ca33c8f0cfe9c46d4c2fc9a6878ee304a1b291b29632b136cd2e66689',
            'a4dba51ca33c8f0cf21c4254c27c9258664a0d621b315bb8779bc69c92ba32f0',
            'a4dba51ca33c8f1cc65c465cc25c9278646e112a1bb1339873bbd33892bc66c1',
            'a45aa53ca73ccf1ce65c427cc2788778666e26aa0b990b99339bd1bcd2baa6c4',
          ]

          def dhash(path, size=16):
              im = Image.open(path).convert('L').resize((size + 1, size), Image.Resampling.LANCZOS)
              pix = list(im.getdata())
              value = 0
              for y in range(size):
                  row = y * (size + 1)
                  for x in range(size):
                      value = (value << 1) | (1 if pix[row + x + 1] > pix[row + x] else 0)
              return value

          expected = [int(x, 16) for x in expected_hex]
          files = sorted([p for p in Path('/tmp/hero-src').iterdir() if p.is_file()])
          if len(files) != 10:
              raise SystemExit(f'Expected 10 files from Dropbox, found {len(files)}')
          actual = [dhash(p) for p in files]

          def dist(a, b):
              return (a ^ b).bit_count()

          # Optimal one-to-one assignment via DP over bitmasks.
          n = 10
          INF = 10**9
          dp = {0: (0, [])}
          for i in range(n):
              ndp = {}
              for mask, (cost, assign) in dp.items():
                  for j in range(n):
                      if mask & (1 << j):
                          continue
                      nm = mask | (1 << j)
                      nc = cost + dist(expected[i], actual[j])
                      if nm not in ndp or nc < ndp[nm][0]:
                          ndp[nm] = (nc, assign + [j])
              dp = ndp

          total, assign = dp[(1 << n) - 1]
          print('total hamming distance:', total)
          for i, j in enumerate(assign, 1):
              d = dist(expected[i-1], actual[j])
              src = files[j]
              out = Path('public/hero') / f'frame-{i:02d}.png'
              out.write_bytes(src.read_bytes())
              print(f'frame-{i:02d}: {src.name} distance={d} -> {out}')
              if d > 45:
                  raise SystemExit(f'Perceptual match too weak for frame {i}: distance={d}')
          PY

      - name: Verify PNG signatures and dimensions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          from pathlib import Path
          for i in range(1, 11):
              p = Path(f'public/hero/frame-{i:02d}.png')
              data = p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{p} is not PNG')
              w, h = struct.unpack('>II', data[16:24])
              if w < 768 or h < 1100:
                  raise SystemExit(f'{p} too small: {w}x{h}')
              print(f'{p}: {w}x{h}, {len(data)} bytes')
          PY

      - name: Commit imported PNG assets
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hero/frame-*.png
          git diff --cached --quiet || git commit -m 'assets: import original PNG hero sequence'
          git push origin HEAD:asset/png-hero-refresh
