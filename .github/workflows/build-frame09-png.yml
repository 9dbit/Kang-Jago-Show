name: Build frame 09 PNG
on:
  push:
    paths:
      - '.frame09-ready'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild PNG from chunks
        run: |
          cat .frame09-parts/*.b64 | base64 -d > public/hero/frame-09-mobile.png
          echo 'b7a99b93ef4c119574a3156b025ba5d0e39df725317df6d493b1fef0b4e19e09  public/hero/frame-09-mobile.png' | sha256sum -c -
      - name: Commit PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hero/frame-09-mobile.png
          git diff --cached --quiet || git commit -m 'assets: add sharp mobile PNG for hero frame 09'
          git push
